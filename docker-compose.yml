# Values come from .env (copy .env.example to .env first).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: couchy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 5433 on the host so it does not clash with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - couchy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d couchy"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./Couchy.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=couchy;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  couchy-db:
